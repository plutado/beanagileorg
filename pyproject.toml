[project]
name = "beanagileorg"
version = "0.1.0"
description = "Local-first supporting apps for engineering leaders: a delivery toolkit and a comms studio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
beanagileorg = "beanagileorg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beanagileorg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
